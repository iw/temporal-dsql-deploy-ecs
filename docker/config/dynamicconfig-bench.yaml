# Dynamic configuration for Aurora DSQL - Bench Environment
# Infrastructure: 10 × m8g.4xlarge EC2, 4096 shards, 3-node OpenSearch
# Target: WPS 200-400
#
# VALIDATED: All keys verified against temporal-dsql/common/dynamicconfig/constants.go

# =============================================================================
# System Settings
# =============================================================================

system.enableActivityEagerExecution:
  - value: true
    constraints: {}

system.enableNamespaceNotActiveAutoForwarding:
  - value: true
    constraints: {}

system.enableNexus:
  - value: false
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

system.transactionSizeLimit:
  - value: 4000000
    constraints: {}

# =============================================================================
# Persistence Settings
# =============================================================================

history.persistenceMaxQPS:
  - value: 15000
    constraints: {}

matching.persistenceMaxQPS:
  - value: 15000
    constraints: {}

frontend.persistenceMaxQPS:
  - value: 15000
    constraints: {}

# =============================================================================
# History Service Settings
# =============================================================================

history.timerProcessorMaxPollRPS:
  - value: 200
    constraints: {}

history.timerProcessorUpdateAckInterval:
  - value: 5s
    constraints: {}

history.transferProcessorMaxPollRPS:
  - value: 400
    constraints: {}

history.transferTaskBatchSize:
  - value: 200
    constraints: {}

history.rps:
  - value: 10000
    constraints: {}

history.defaultActivityRetryPolicy:
  - value:
      InitialIntervalInSeconds: 1
      MaximumIntervalInSeconds: 100
      BackoffCoefficient: 2.0
      MaximumAttempts: 0
    constraints: {}

# =============================================================================
# History Cache Settings (CRITICAL for benchmark performance)
# =============================================================================

history.cacheSizeBasedLimit:
  - value: true
    constraints: {}

# Max cache size per history host: 2GB
# With 16 history replicas = 32GB total cache capacity
history.hostLevelCacheMaxSizeBytes:
  - value: 2147483648
    constraints: {}

history.cacheTTL:
  - value: 1h
    constraints: {}

history.cacheNonUserContextLockTimeout:
  - value: 500ms
    constraints: {}

# =============================================================================
# Matching Service Settings (Tuned for high WPS)
# =============================================================================

matching.rps:
  - value: 10000
    constraints: {}

# Task queue partitions - reduced from 16 to 8 to increase poller density
# With 480 pollers / 8 partitions = ~60 pollers per partition
matching.numTaskqueueWritePartitions:
  - value: 8
    constraints:
      namespace: "benchmark"
      taskQueueName: "benchmark-tq-v2"
  - value: 8
    constraints: {}

matching.numTaskqueueReadPartitions:
  - value: 8
    constraints:
      namespace: "benchmark"
      taskQueueName: "benchmark-tq-v2"
  - value: 8
    constraints: {}

matching.maxTaskBatchSize:
  - value: 200
    constraints: {}

matching.getTasksBatchSize:
  - value: 1000
    constraints: {}

matching.longPollExpirationInterval:
  - value: 60s
    constraints: {}

# Forwarder settings - moderate values to avoid draining pollers from child partitions
# With 8 partitions and good poller density, forwarding should be minimal
matching.forwarderMaxOutstandingPolls:
  - value: 20
    constraints: {}

matching.forwarderMaxOutstandingTasks:
  - value: 1000
    constraints: {}

matching.forwarderMaxRatePerSecond:
  - value: 2000
    constraints: {}

# =============================================================================
# Frontend Service Settings
# =============================================================================

frontend.rps:
  - value: 30000
    constraints: {}

frontend.namespaceRPS:
  - value: 30000
    constraints: {}

frontend.namespaceCount:
  - value: 4000
    constraints: {}

frontend.visibilityMaxPageSize:
  - value: 1000
    constraints: {}
